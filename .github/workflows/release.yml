name: Подготовка релиза и публикация в хабе

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: autumn-library/workflows/.github/workflows/release.yml@v1
    with:
      oscript_version: stable
      package_mask: fluent-*.ospx
      trusted_publishing: true
